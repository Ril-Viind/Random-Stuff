name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL (e.g. https://your-service.onrender.com)"
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build debug APK
        working-directory: ./app
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --debug --dart-define="PATHLY_API_BASE_URL=$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathly-android-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
