services:
  - type: web
    name: pathly-backend
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: "openai/gpt-oss-120b"
      - key: NVIDIA_BASE_URL
        value: "https://integrate.api.nvidia.com/v1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "nvidia/nemotron-3.5-lightning:free"
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pathly-db
          property: connectionString

databases:
  - name: pathly-db
    databaseName: pathly
    plan: free
